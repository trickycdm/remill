name: Preview cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Tear down PR preview (remill-pr)
    runs-on: ubuntu-latest
    # Same per-PR group as the preview job in ci.yml: starting teardown cancels any
    # in-flight preview run for this PR so it can't re-create resources after deletion.
    concurrency:
      group: remill-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Guard — need deploy secrets
        id: guard
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cleanup skipped: no CLOUDFLARE_API_TOKEN configured."
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          bun-version: latest

      - name: Delete preview Worker and D1
        if: steps.guard.outputs.ready == 'true'
        run: |
          NAME="remill-pr-${{ github.event.pull_request.number }}"
          # Best-effort: a missing resource (PR never deployed) must not fail the job.
          bunx wrangler delete "$NAME" --force || echo "Worker $NAME not found (skipping)"
          bunx wrangler d1 delete "$NAME" -y || echo "D1 $NAME not found (skipping)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Note teardown on the PR
        if: steps.guard.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- remill-preview-url -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            const body = `${marker}\n🧹 **remill preview torn down** — Worker and D1 \`remill-pr-${issue_number}\` deleted.`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
