name: Preview cleanup

on:
  pull_request:
    types: [closed]
  # Manual teardown for a preview the automatic pass missed (see the race note below).
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number whose remill-pr-<N> preview to tear down'
        required: true

jobs:
  cleanup:
    name: Tear down PR preview (remill-pr)
    runs-on: ubuntu-latest
    # Same per-PR group as the preview job in ci.yml: starting teardown cancels any
    # in-flight preview run for this PR so it can't re-create resources after deletion.
    concurrency:
      group: remill-preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Guard — need deploy secrets
        id: guard
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cleanup skipped: no CLOUDFLARE_API_TOKEN configured."
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          bun-version: latest

      # RACE: cancel-in-progress signals the preview run, but a wrangler deploy already in
      # flight can finish AFTER our delete — "not found" here can mean "not created yet".
      # So deletion retries over ~90s and only trusts "not found" once it repeats after the
      # grace window. Real failures (auth, network) surface instead of being swallowed.
      - name: Delete preview Worker and D1 (race-aware)
        if: steps.guard.outputs.ready == 'true'
        run: |
          NAME="remill-pr-${{ github.event.pull_request.number || inputs.pr_number }}"
          delete_with_retry() {
            local what="$1"; shift
            for attempt in 1 2 3 4; do
              out=$("$@" 2>&1) && { echo "$what $NAME deleted."; return 0; }
              if echo "$out" | grep -qiE "does not exist|not found|couldn't find|could not find|couldn't be found|could not be found"; then
                if [ "$attempt" = 4 ]; then echo "$what $NAME not found (nothing to delete)."; return 0; fi
                echo "$what $NAME not found yet (deploy may still be in flight) — retry $attempt/3 in 30s..."
                sleep 30
              else
                echo "$out" >&2
                echo "Deleting $what $NAME failed for a reason other than absence." >&2
                return 1
              fi
            done
          }
          delete_with_retry "Worker" bunx wrangler delete "$NAME" --force
          delete_with_retry "D1" bunx wrangler d1 delete "$NAME" -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Note teardown on the PR
        if: steps.guard.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- remill-preview-url -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            const body = `${marker}\n🧹 **remill preview torn down** — Worker and D1 \`remill-pr-${issue_number}\` deleted.`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
